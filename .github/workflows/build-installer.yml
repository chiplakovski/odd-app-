name: Build Windows Installer

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application (PyInstaller)
        run: pyinstaller packaging\build.spec --noconfirm

      - name: Download clawPDF (oddprint virtual printer engine)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path packaging\vendor | Out-Null
          $dest = "packaging\vendor\clawPDF_setup.msi"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/clawsoftware/clawPDF/0.9.3/src/_MSI/clawPDF_0.9.3_setup.msi" -OutFile $dest
          $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash
          $expected = "4B8102955E7A75149C45EFC968643DB87B3AED85753136B186734EE1C614298C"
          if ($hash -ne $expected) {
            throw "clawPDF_setup.msi checksum mismatch: got $hash, expected $expected"
          }
          Write-Host "clawPDF_setup.msi verified: $hash"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        run: iscc packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ODD-Inspection-Report-Generator-Setup
          path: packaging\Output\ODD_Inspection_Report_Generator_Setup.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging\Output\ODD_Inspection_Report_Generator_Setup.exe
